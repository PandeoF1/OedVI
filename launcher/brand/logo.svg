<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Sunset palette: magenta, pink, orange, gold, with violet and teal. -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0f4d"/>
      <stop offset="0.55" stop-color="#5b1a6e"/>
      <stop offset="1" stop-color="#c2306f"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ff4f9a" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ff4f9a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd23f"/>
      <stop offset="0.35" stop-color="#ff8a3d"/>
      <stop offset="0.7" stop-color="#ff2e88"/>
      <stop offset="1" stop-color="#b03cff"/>
    </linearGradient>
    <linearGradient id="letters" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.45" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff3d8b"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#sun)"/>
    <!-- Horizon stripes, retro sunset -->
    <g fill="#ff2e88" opacity="0.16">
      <rect y="372" width="512" height="10"/>
      <rect y="400" width="512" height="14"/>
      <rect y="432" width="512" height="18"/>
      <rect y="470" width="512" height="24"/>
    </g>
  </g>

  <!-- O -->
  <circle cx="256" cy="256" r="164" fill="none" stroke="url(#ring)" stroke-width="44" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="164" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"/>

  <!-- VI: teal offset shadow, then the letters -->
  <g transform="translate(9 9)" fill="#19d3c5" opacity="0.9">
    <path d="M145 168h48l33 118 33-118h48l-57 176h-48z"/>
    <path d="M322 168h46v176h-46z"/>
  </g>
  <g fill="url(#letters)">
    <path d="M145 168h48l33 118 33-118h48l-57 176h-48z"/>
    <path d="M322 168h46v176h-46z"/>
  </g>
</svg>
