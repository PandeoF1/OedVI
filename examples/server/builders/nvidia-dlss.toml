# The NVIDIA files (Streamline, DLSS, frame generation: about 70 MB) are
# fetched by the build, from NVIDIA's own GitHub (NVIDIA-RTX/Streamline, tag
# pinned by the fork's scripts/get-nvidia-sdks.ps1) into nvidia-sdk\ in the
# clone. The step does nothing when they are already there. They are NVIDIA's
# files under NVIDIA's licences, saved beside them. Needs a GeForce RTX card
# (frame generation: RTX 40 or later), Windows 10 2004+ and hardware-
# accelerated GPU scheduling (Settings > System > Display > Graphics).
#
# Frame generation asks the driver how many frames the card makes and gives
# no more: 4 means 4x on an RTX 50 and 2x on an RTX 40.
extends = "victory-nvidia"
name = "NVIDIA · DLSS Quality + frame generation"
description = "Series X 1440p, DLSS Quality, frame generation. The build fetches NVIDIA's DLSS files."
tags = ["victory", "nvidia", "dlss", "series-x"]
order = 61

build = [
  ["cargo", "build", "--locked", "--profile", "{profile}", "-p", "victory", "{cargo_flags...}"],
  ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "{repo_dir}/scripts/get-nvidia-sdks.ps1"],
]

[vars]
run_flags = "--res 1440 --dlss quality --framegen 4"

# `play` keeps this one, and finds the files the build step fetched.
[env]
VICTORY_STREAMLINE_DIR = "{repo_dir}/nvidia-sdk/Streamline/bin/x64"
