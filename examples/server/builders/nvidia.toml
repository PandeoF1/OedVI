# The NVIDIA fork of VIctory, in its own clone. Series S settings measured on
# an RTX 5070 by the fork's author (scripts/play-nvidia.ps1 of the repository):
# half render scale with the title's own upscaler, more descriptor slots (an
# NVIDIA view heap is capped at 1,000,000), no ray-tracing skip list.
extends = "victory"
name = "NVIDIA · Release Series S"
description = "trustno1-coder/VIctory-NVIDIA, main branch."
repo = "https://github.com/trustno1-coder/VIctory-NVIDIA"
checkout = "victory-nvidia"
tags = ["victory", "nvidia", "release", "series-s"]
order = 60

[vars]
console = "series-s"

[run_env]
VICTORY_TEXTURE_NO_WAIT = "1"
VICTORY_RELAY = "2"
VICTORY_CARD_STEPS = "2"
VICTORY_WIDE_BACK = "1"
VICTORY_CARD_REHASH_RUNS = "1"
VICTORY_JOIN_COPIES = "1"
VICTORY_INDIRECT_WINDOW = "1"
VICTORY_RELAY_COPY = "1"
VICTORY_INDIRECT_BATCH = "2"
VICTORY_MAP_THREADS = "1"
VICTORY_TITLE_PRIORITIES = "0"
VICTORY_CARD_AWAKE = "1"
VICTORY_SHOW_AFTER = "1"
VICTORY_AMBIENT = "0.8"
VICTORY_AMBIENT_AIR = "1.5"
VICTORY_AMBIENT_MOST = "2"
VICTORY_NAN_SCRUB = "1"
VICTORY_THIN = "1"
VICTORY_JOIN_PARTS = "8"
VICTORY_UPLOAD_AHEAD = "1"
VICTORY_PIPELINE_WAIT_MS = "10000"
VICTORY_DYNAMIC_SLOTS = "524288"
VICTORY_RENDER_SCALE = "0.5"
VICTORY_OWN_UPSCALER = "1"
VICTORY_BVH_MISS = "1"
VICTORY_CARD_BUFFERS_MIN_MB = "1"
VICTORY_CARD_BUFFERS_MB = "1536"
VICTORY_COMPOSE = "1"
