# Vice-Tay, Series S with DLSS Quality and 2x frame generation (AMD FSR 3.1.6
# provider, works on any D3D12 card). The author's sample: 22.4 rendered fps,
# 44.9 presented.
# The AMD FidelityFX DLLs are fetched by the build: a sparse clone of AMD's own
# FidelityFX-SDK (GPUOpen-LibrariesAndSDKs, tag v2.4.0, commit checked) into
# the cache, Kits/FidelityFX/signedbin only (about 170 MB). Nothing happens
# when they are already there. They are AMD's signed files under AMD's licence.
# OedVI's fps are the rendered frames, not the presented ones: the panel's
# "FG OUTPUT FPS" and the window title tell the presented count.
extends = "victory-vicetay"
name = "Vice-Tay · Series S + DLSS + frame generation"
description = "Series S, DLSS Quality, 2x AMD frame generation. The build fetches AMD's FidelityFX DLLs."
tags = ["victory", "vicetay", "diag", "series-s", "dlss", "frame-generation"]
order = 92

build = [
  ["cargo", "build", "--locked", "--profile", "{profile}", "-p", "victory", "{cargo_flags...}"],
  ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command", "$ErrorActionPreference = 'Stop'; $d = '{cache_dir}/ffx-sdk'; $b = 'Kits/FidelityFX/signedbin'; if (-not (Test-Path \"$d/$b/amd_fidelityfx_framegeneration_dx12.dll\")) {{ if (Test-Path $d) {{ Remove-Item -Recurse -Force $d }}; git clone --quiet --depth 1 --branch v2.4.0 --filter=blob:none --sparse https://github.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK $d; if ($LASTEXITCODE) {{ throw 'clone failed' }}; git -C $d sparse-checkout set $b; if ($LASTEXITCODE) {{ throw 'sparse-checkout failed' }}; if ((git -C $d rev-parse HEAD) -ne '7539ae8b6568ad29ed78a753404351daf3b5cca7') {{ throw 'unexpected SDK commit' }} }}"],
]

[run_env]
VICTORY_DLSS = "quality"
VICTORY_FRAMEGEN = "1"
VICTORY_FFX_FG_DIR = "{cache_dir}/ffx-sdk/Kits/FidelityFX/signedbin"
