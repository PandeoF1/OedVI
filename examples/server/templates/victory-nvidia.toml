# trustno1-coder/VIctory-NVIDIA, started the way the repository's README says:
# `victory play`, which has the fork's own settings built in (the old
# scripts\play-foxhound.ps1, kept up to date by the author). So this template
# no longer copies the settings: they would drift (the memory stack, the
# texture-pass and helper-priority settings were missing). Tested by the author
# on an RTX 4070 SUPER and RTX 5070 Ti.
#
# `play` clears every VICTORY_* variable it did not set itself (only the paths
# below stay), so "Commands and variables" cannot add a plain VICTORY_X: put
# `--set VICTORY_X=1` in the builder's run flags instead. What the F1 menu
# saves (victory-settings.txt under %LOCALAPPDATA%\victory) is now read, and
# beats the options below, as at every start of the fork.
# The first start of each new victory.exe would restart the game by itself (in
# a console of its own, out of the launcher's sight): turned off here
# (VICTORY_WARMUP_RESTART=0), at the price of a slower first run of a new build.
# Windows 10: `play` fetches Microsoft's newer Direct3D 12 runtime by itself
# (beside victory.exe, signed and checked) when it is needed.
extends = "victory"
repo = "https://github.com/trustno1-coder/VIctory-NVIDIA"
checkout = "victory-nvidia"
tags = ["victory", "nvidia"]

run = [
  "{repo_dir}/target/{profile_dir}/victory{exe_suffix}",
  "play", "{game_dir}/{game_exe}", "--set", "VICTORY_WARMUP_RESTART=0", "{run_flags...}",
]

[vars]
# --series-s or not, --res 1440|1080to1440|4k, --dlss off|dlaa|quality|balanced|performance,
# --framegen 2..6 (frames shown per frame rendered), --fg-type auto|dlss|fsr, --fps, --set NAME=VALUE
run_flags = "--dlss off"
