[workspace]
resolver = "3"
members = [
    "crates/common",
    "crates/server",
    "crates/client",
    "crates/cli",
    "launcher/src-tauri",
]
# The launcher needs WebView system libraries; `cargo build` at the root
# builds everything else.
default-members = ["crates/common", "crates/server", "crates/client", "crates/cli"]

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
oedvi-common = { path = "crates/common" }
oedvi-client = { path = "crates/client" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
blake3 = { version = "1.5", features = ["rayon"] }
hex = "0.4"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip"] }
futures-util = "0.3"
globset = "0.4"
walkdir = "2"
tempfile = "3"
regex = "1"

[profile.release]
lto = "thin"
codegen-units = 4
